name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sjvtdm_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: sjvtdm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sjvtdm_test -d sjvtdm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sjvtdm_test:test_only@localhost:5432/sjvtdm_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and PostgreSQL integration tests
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml
          python -m coverage html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
